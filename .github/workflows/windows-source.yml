name: Windows source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit and protocol checks
        run: npm test
      - name: Typecheck and compile
        run: npm run build
      - name: Workspace interaction and failure regressions
        run: npm run test:audit
      - name: Reader latency and resource regressions
        run: npm run test:reading-performance && npm run test:reply-refresh && node scripts/thread-autoload-smoke.cjs
      - name: Isolated Pro runtime and Windows credential protection
        run: node tests/userscript-electron-run.cjs

      - name: Review boundaries, notices and navigation
        run: npm run test:review
      - name: Full application with isolated forum fixtures
        env:
          SEEKDESK_OFFLINE: '1'
        run: npm run test:app
